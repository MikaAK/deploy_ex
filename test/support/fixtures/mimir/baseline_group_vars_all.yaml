deploy_s3_bucket: deploy-ex-elixir-deploys-test

aws_credentials:
  AWS_ACCESS_KEY_ID: "<INSERT_SECRET_OR_PRELOAD_ON_MACHINE>"
  AWS_SECRET_ACCESS_KEY: "<INSERT_SECRET_OR_PRELOAD_ON_MACHINE>"


loki_logger_s3_region: us-west-2
loki_logger_s3_bucket_name: deploy-ex-backend-logs-test
loki_logger_retention: 30d

env: test

# Fill in after the first `mix terraform.apply` — the Loki node's IP is
# DHCP-assigned, not known at render time. Discover it with:
#   mix deploy_ex.find_nodes --tag MonitoringKey=loki_logger
grafana_loki_url: "http://FILL_IN_AFTER_FIRST_APPLY:3100"

# Fill in after the first `mix terraform.apply` — prometheus_db's IP is
# DHCP-assigned, not known at render time. Discover it with:
#   mix deploy_ex.find_nodes --tag MonitoringKey=prometheus_db
grafana_prometheus_url: "http://FILL_IN_AFTER_FIRST_APPLY:9090"

prometheus_scrape_region: us-west-2
prometheus_retention_size: 4GB
prometheus_retention_time: 7d



# Fill in after the first `mix terraform.apply` — the Sentry node's IP is
# DHCP-assigned, not known at render time. Discover it with:
#   mix deploy_ex.find_nodes --tag MonitoringKey=sentry
# Only sets system.url-prefix (UI link-building); the container binds to the
# node's own address via SENTRY_BIND regardless, and ingest uses the DSN.
sentry_url: "http://FILL_IN_AFTER_FIRST_APPLY:9000"

system_env:
  - PATH=/root/.asdf/shims:/root/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
