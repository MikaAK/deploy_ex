- name: redis
  tags: redis
  block:
  - name: Populate service facts
    service_facts:

  # The redis-stack-server binary (/opt/redis-stack) is a Debian-only artefact: it links
  # libssl1.1, which Ubuntu 24.04 does not ship, and packages.redis.io publishes no
  # redis-stack-server for noble at all. Redis 8 folded the stack modules into redis-server
  # itself, so an Ubuntu host with redis_stack_enabled installs redis-server 8.x from
  # packages.redis.io and runs it under the plain redis unit — same features, no /opt binary.
  - name: Decide whether the redis-stack binary path applies
    set_fact:
      redis_use_stack_binary: "{{ redis_stack_enabled and ansible_facts['distribution'] == 'Debian' }}"

  - name: Configure vm.overcommit_memory for Redis
    sysctl:
      name: vm.overcommit_memory
      value: '1'
      state: present
      reload: true

  - name: Configure vm.swappiness for Redis
    sysctl:
      name: vm.swappiness
      value: '1'
      state: present
      reload: true

  - name: Disable Transparent Huge Pages (THP)
    shell: |
      echo madvise > /sys/kernel/mm/transparent_hugepage/enabled
    changed_when: false

  - name: Add THP disable to rc.local
    lineinfile:
      path: /etc/rc.local
      line: 'echo madvise > /sys/kernel/mm/transparent_hugepage/enabled'
      create: yes
      mode: '0755'
      insertbefore: 'exit 0'

  # redis_version is a Debian package revision (…+deb13u1) that does not exist in Ubuntu's
  # archive; Ubuntu gets its redis from packages.redis.io further down.
  - name: Install Redis packages
    apt:
      name:
        - redis-tools={{ redis_version }}
        - redis-server={{ redis_version }}
        - redis={{ redis_version }}
      state: present
      update_cache: true
    when: ansible_facts['distribution'] == 'Debian'

  - name: Install GPG
    apt:
      name: gpg
      state: present
      update_cache: true
    when: redis_stack_enabled

  - name: Check Redis GPG
    stat:
      path: /usr/share/keyrings/redis-archive-keyring.gpg
    register: redis_gpg_key

  - name: Add Redis gpg key
    shell: curl -fsSL https://packages.redis.io/gpg | gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
    when: redis_stack_enabled and not redis_gpg_key.stat.exists

  - name: Check Redis Stack Source List
    stat:
      path: /etc/apt/sources.list.d/redis.list
    when: redis_stack_enabled
    register: redis_stack_source_list

  - name: Add source repository into sources list
    shell: |
      echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb bullseye main" | tee /etc/apt/sources.list.d/redis.list
    when: redis_stack_enabled and not redis_stack_source_list.stat.exists and ansible_facts['distribution'] == 'Debian'

  - name: Add source repository into sources list (Ubuntu codename)
    shell: |
      echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb {{ ansible_facts['distribution_release'] }} main" | tee /etc/apt/sources.list.d/redis.list
    when: redis_stack_enabled and not redis_stack_source_list.stat.exists and ansible_facts['distribution'] == 'Ubuntu'

  - name: Add bullseye repo (deb822) for libssl1.1 only
    when: ansible_facts['distribution'] == 'Debian'
    deb822_repository:
      name: debian-bullseye
      types: [deb]
      uris: https://deb.debian.org/debian
      suites: [bullseye]
      components: [main]
      enabled: true
      state: present

  - name: Pin libssl1.1 so only that package can come from bullseye
    when: ansible_facts['distribution'] == 'Debian'
    copy:
      dest: /etc/apt/preferences.d/libssl1.1.pref
      mode: '0644'
      content: |
        Package: redis-stack-server
        Pin: release n=bullseye
        Pin-Priority: 1001

        Package: libssl1.1
        Pin: release n=bullseye
        Pin-Priority: 1001

        Package: *
        Pin: release n=bullseye
        Pin-Priority: -10

  - name: Update apt cache
    apt:
      update_cache: true
      cache_valid_time: 0

  - name: Install libssl1.1 runtime
    apt:
      name: libssl1.1
      state: present
    when: ansible_facts['distribution'] == 'Debian'

  - name: Install Redis Stack
    apt:
      name: redis-stack-server
      update_cache: true
      default_release: "bullseye"
      state: present
    when: redis_use_stack_binary

  - name: Install Redis 8 from packages.redis.io (Ubuntu)
    apt:
      name:
        - redis-server
        - redis-tools
      update_cache: true
      state: present
    when: ansible_facts['distribution'] == 'Ubuntu'

  - name: Add redis.conf file to /etc/redis/redis.conf
    template:
      src: redis.conf
      dest: /etc/redis/redis.conf
      owner: root
      group: root
      mode: o+r

  - name: Copy redis-stack.service to /etc/systemd/system/redis-stack.service
    copy:
      src: redis-stack.service
      dest: /etc/systemd/system/redis-stack.service
      owner: root
      group: root
      mode: 0644
    when: redis_use_stack_binary

  - name: Run ulimit -n 65536
    shell: ulimit -n 65536 # noqa command-instead-of-shell
    changed_when: false

  - name: Copy limits.conf file to /etc/security/limits.conf
    copy:
      src: limits.conf
      mode: 0644
      owner: root
      dest: /etc/security/limits.conf
      group: root

  - name: Copy security.conf file to /etc/systemd/system.conf
    copy:
      src: system.conf
      mode: 0644
      owner: root
      dest: /etc/systemd/system.conf
      group: root

  - name: Copy user.conf file to /etc/systemd/user.conf
    copy:
      src: system.conf
      mode: 0644
      owner: root
      dest: /etc/systemd/user.conf
      group: root

  - name: Stop redis-server service when redis stack is enabled
    systemd:
      name: redis-server
      state: stopped
    when: redis_use_stack_binary

  - name: Disable redis-server service when redis stack is enabled
    systemd:
      name: redis-server
      enabled: false
    when: redis_use_stack_binary

  - name: Check if redis.service is a symlink
    stat:
      path: /etc/systemd/system/redis.service
    register: redis_service_unit
    when: redis_use_stack_binary

  - name: Remove redis.service symlink when redis stack is enabled
    file:
      path: /etc/systemd/system/redis.service
      state: absent
    when:
      - redis_use_stack_binary
      - redis_service_unit.stat.exists | default(false)
      - redis_service_unit.stat.islnk | default(false)

  - name: Mask redis-server service when redis stack is enabled
    systemd:
      name: redis-server
      masked: true
    when: redis_use_stack_binary

  - name: Stop and disable redis alias service when redis stack is enabled
    systemd:
      name: redis
      state: stopped
      enabled: false
    failed_when: false
    when: redis_use_stack_binary

  - name: Start redis service
    systemd:
      name: redis
      state: started
    when: not redis_use_stack_binary and ansible_facts['distribution'] == 'Debian'

  # restarted, not started: the packages.redis.io install already brought redis up on the
  # stock conf, so a plain `started` would leave our /etc/redis/redis.conf unread until the
  # next reboot.
  - name: Restart redis-server with the managed config (Ubuntu)
    systemd:
      name: redis-server
      daemon_reload: true
      enabled: true
      state: restarted
    when: ansible_facts['distribution'] == 'Ubuntu'

  - name: Reload, Enable & Stop redis stack service
    systemd:
      name: redis-stack
      daemon_reload: true
      enabled: true
      state: stopped
    when: redis_use_stack_binary

  - name: Start redis stack service
    systemd:
      name: redis-stack
      state: started
    when: redis_use_stack_binary

  - name: Stop redis-exporter service
    systemd:
      name: redis-exporter
      state: stopped
    when: "'redis-exporter.service' in services"

  - name: Create /opt/redis_exporter directory
    file:
      path: /opt/redis_exporter
      state: directory
      mode: 0644

  - name: Install unzip
    apt:
      name: unzip
      update_cache: true

  - name: Download redis-exporter {{ redis_exporter_version }}
    unarchive:
      src: https://github.com/oliver006/redis_exporter/releases/download/{{ redis_exporter_version }}/redis_exporter-{{ redis_exporter_version }}.linux-amd64.tar.gz
      dest: /tmp
      remote_src: true

  - name: Copy redis-exporter install from /tmp to /opt
    copy:
      src: /tmp/redis_exporter-{{ redis_exporter_version }}.linux-amd64/
      dest: /opt/redis_exporter/
      mode: 0644
      remote_src: true

  - name: Copy redis-exporter.service file to /etc/systemd/system/redis-exporter.service
    copy:
      src: redis-exporter.service
      dest: /etc/systemd/system/redis-exporter.service
      mode: 0644

  - name: Enable redis-exporter service
    systemd:
      name: redis-exporter
      daemon_reload: true
      enabled: true

  - name: Start redis-exporter service
    systemd:
      name: redis-exporter
      state: started
  become: true
