# Versions are pinned to GitHub Releases artifacts because RabbitMQ's apt mirrors
# (ppa1.rabbitmq.com / ppa*.novemberain.com) were unresolvable or 404 from both a laptop and an
# OCI node on 2026-08-18, while the GitHub Releases path was verified end to end (Erlang 27 +
# RabbitMQ 4.1.8 installed and active on Ubuntu 24.04). Ubuntu's own archive carries 3.12,
# which predates the 4.x quorum-queue semantics the app relies on.
rabbitmq_version: 4.1.8
rabbitmq_erlang_version: 27.3.4.16
rabbitmq_erlang_release_tag: "{{ rabbitmq_erlang_version }}-ubuntu/{{ ansible_facts['distribution_release'] }}"
rabbitmq_erlang_tarball_url: "https://github.com/rabbitmq/erlang-debian-package/releases/download/{{ rabbitmq_erlang_release_tag }}/erlang-{{ rabbitmq_erlang_version }}-ubuntu-{{ ansible_facts['distribution_release'] }}.tar.gz"
rabbitmq_deb_url: "https://github.com/rabbitmq/rabbitmq-server/releases/download/v{{ rabbitmq_version }}/rabbitmq-server_{{ rabbitmq_version }}-1_all.deb"

# The subset of the Erlang debs RabbitMQ needs; the tarball ships 41 and the rest (wx, jinterface,
# examples, manpages …) is dead weight on a broker.
rabbitmq_erlang_packages:
  - erlang-base
  - erlang-asn1
  - erlang-crypto
  - erlang-eldap
  - erlang-ftp
  - erlang-inets
  - erlang-mnesia
  - erlang-os-mon
  - erlang-parsetools
  - erlang-public-key
  - erlang-runtime-tools
  - erlang-snmp
  - erlang-ssl
  - erlang-syntax-tools
  - erlang-tftp
  - erlang-tools
  - erlang-xmerl

rabbitmq_vhost: tft

# The application's AMQP identity: full configure/write/read on the vhost. Password comes from
# the consuming project's (gitignored) group vars — an empty default means the user is NOT
# created, so a missing secret fails loudly at the app's first connect instead of shipping a
# guessable credential.
rabbitmq_app_user: opgg_app
rabbitmq_app_password: ""

# The management-API identity the app's BrokerMgmt uses (RABBITMQ_MGMT_RO_USER). It needs the
# `management` tag plus read AND write on the vhost — BrokerMgmt.publish_message posts through
# the HTTP API — so "read-only" is the app's name for it, not its permission set. `configure`
# stays empty: it can neither declare nor delete queues.
rabbitmq_mgmt_user: tft_admin_ro
rabbitmq_mgmt_password: ""

# `guest` is loopback-only upstream (rabbitmq.conf loopback_users) and stays that way here;
# the dev docker-compose widens it, prod does not.
rabbitmq_management_listener_port: 15672
rabbitmq_amqp_port: 5672

# Quorum queues want a real disk floor; the upstream default (50MB) is a laptop number.
rabbitmq_disk_free_limit: 2GB
rabbitmq_vm_memory_high_watermark: 0.6
