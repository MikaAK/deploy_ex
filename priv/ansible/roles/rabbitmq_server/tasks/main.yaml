- name: rabbitmq
  tags: rabbitmq
  become: true
  block:
  - name: Populate service facts
    service_facts:

  - name: Check installed rabbitmq version
    command: dpkg-query -W -f='${Version}' rabbitmq-server
    register: rabbitmq_installed
    changed_when: false
    failed_when: false

  - name: Check installed erlang version
    command: dpkg-query -W -f='${Version}' erlang-base
    register: erlang_installed
    changed_when: false
    failed_when: false

  # Erlang comes from RabbitMQ's own debian-package releases (a tarball of debs per Ubuntu
  # codename), unpacked and installed by path so apt resolves the intra-Erlang dependencies.
  - name: Install Erlang {{ rabbitmq_erlang_version }}
    when: not erlang_installed.stdout.startswith(rabbitmq_erlang_version)
    block:
      - name: Create erlang download directory
        file:
          path: /opt/deploy_ex/erlang
          state: directory
          mode: '0755'

      - name: Download erlang debs tarball
        get_url:
          url: "{{ rabbitmq_erlang_tarball_url }}"
          dest: /opt/deploy_ex/erlang/erlang.tar.gz
          mode: '0644'
          timeout: 120

      - name: Unpack erlang debs
        unarchive:
          src: /opt/deploy_ex/erlang/erlang.tar.gz
          dest: /opt/deploy_ex/erlang
          remote_src: true

      - name: Locate the erlang debs to install
        find:
          paths: /opt/deploy_ex/erlang
          patterns: "{{ rabbitmq_erlang_packages | map('regex_replace', '$', '_*.deb') | list }}"
          recurse: true
        register: erlang_debs

      - name: Install erlang debs
        apt:
          deb: "{{ item }}"
        loop: "{{ erlang_debs.files | map(attribute='path') | sort }}"

  - name: Download rabbitmq-server {{ rabbitmq_version }}
    get_url:
      url: "{{ rabbitmq_deb_url }}"
      dest: /opt/deploy_ex/rabbitmq-server_{{ rabbitmq_version }}.deb
      mode: '0644'
      timeout: 120
    when: rabbitmq_installed.stdout != rabbitmq_version ~ '-1'

  - name: Install rabbitmq-server
    apt:
      deb: /opt/deploy_ex/rabbitmq-server_{{ rabbitmq_version }}.deb
    when: rabbitmq_installed.stdout != rabbitmq_version ~ '-1'

  - name: Configure rabbitmq
    template:
      src: rabbitmq.conf.j2
      dest: /etc/rabbitmq/rabbitmq.conf
      owner: rabbitmq
      group: rabbitmq
      mode: '0644'
    register: rabbitmq_conf

  # Plain rabbitmqctl/rabbitmq-plugins throughout: deploy_ex takes no ansible collection
  # dependencies (see ansible.build's inventory note), and every command below is idempotent
  # or guarded so reruns do not churn.
  - name: Enable the management plugin
    command: rabbitmq-plugins enable --offline rabbitmq_management
    register: rabbitmq_mgmt_plugin
    changed_when: "'started' in rabbitmq_mgmt_plugin.stdout or 'enabled' in rabbitmq_mgmt_plugin.stdout"

  - name: Enable and (re)start rabbitmq-server
    systemd:
      name: rabbitmq-server
      enabled: true
      state: "{{ 'restarted' if (rabbitmq_conf.changed or rabbitmq_mgmt_plugin.changed) else 'started' }}"
      daemon_reload: true

  - name: Wait for the broker
    command: rabbitmq-diagnostics -q check_port_connectivity
    register: rabbitmq_ready
    retries: 20
    delay: 5
    until: rabbitmq_ready.rc == 0
    changed_when: false

  - name: List vhosts
    command: rabbitmqctl -q list_vhosts name
    register: rabbitmq_vhosts
    changed_when: false

  - name: Create the {{ rabbitmq_vhost }} vhost
    command: rabbitmqctl add_vhost {{ rabbitmq_vhost }}
    when: rabbitmq_vhost not in rabbitmq_vhosts.stdout_lines

  - name: List users
    command: rabbitmqctl -q list_users
    register: rabbitmq_users
    changed_when: false

  # Created once; a rerun does not rewrite the password, so the app's credential does not
  # churn under it. Rotate by deleting the user and rerunning.
  - name: Create the application user
    command: rabbitmqctl add_user {{ rabbitmq_app_user }} {{ rabbitmq_app_password | quote }}
    when: rabbitmq_app_password != "" and rabbitmq_app_user not in (rabbitmq_users.stdout_lines | map('regex_replace', '\\s.*$', '') | list)
    no_log: true

  - name: Grant the application user full permissions on {{ rabbitmq_vhost }}
    command: rabbitmqctl set_permissions -p {{ rabbitmq_vhost }} {{ rabbitmq_app_user }} ".*" ".*" ".*"
    when: rabbitmq_app_password != ""
    changed_when: false

  - name: Create the management-API user
    command: rabbitmqctl add_user {{ rabbitmq_mgmt_user }} {{ rabbitmq_mgmt_password | quote }}
    when: rabbitmq_mgmt_password != "" and rabbitmq_mgmt_user not in (rabbitmq_users.stdout_lines | map('regex_replace', '\\s.*$', '') | list)
    no_log: true

  - name: Tag the management-API user
    command: rabbitmqctl set_user_tags {{ rabbitmq_mgmt_user }} management
    when: rabbitmq_mgmt_password != ""
    changed_when: false

  - name: Grant the management-API user read+write (no configure) on {{ rabbitmq_vhost }}
    command: rabbitmqctl set_permissions -p {{ rabbitmq_vhost }} {{ rabbitmq_mgmt_user }} "^$" ".*" ".*"
    when: rabbitmq_mgmt_password != ""
    changed_when: false

  - name: Refuse to leave the broker without an application user
    fail:
      msg: "rabbitmq_app_password is empty — set it in the consuming project's (gitignored) group vars so the {{ rabbitmq_app_user }} user is created"
    when: rabbitmq_app_password == ""
