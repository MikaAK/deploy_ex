- name: grafana_alloy
  block:
    - name: Check if old promtail service exists
      stat:
        path: /etc/systemd/system/promtail.service
      register: old_promtail_service

    - name: Stop old promtail service
      systemd:
        name: promtail
        state: stopped
        enabled: false
      when: old_promtail_service.stat.exists
      ignore_errors: true

    - name: Remove old promtail service file
      file:
        path: /etc/systemd/system/promtail.service
        state: absent
      when: old_promtail_service.stat.exists

    - name: Remove old promtail config
      file:
        path: /root/promtail_config.yaml
        state: absent

    - name: Remove old promtail positions file
      file:
        path: /root/promtail_positions.yaml
        state: absent

    # `args: warn: false` was removed in ansible-core 2.14 and is now a hard error:
    # "Unsupported parameters for (ansible.legacy.command) module: warn". MEASURED against
    # ansible-core 2.18.4, where it fails the play. The warning it suppressed was the
    # use-a-module-instead nag, which no longer exists.
    - name: Remove old promtail binary
      shell: rm -f /root/promtail-*

    - name: Reload systemd after promtail cleanup
      systemd:
        daemon_reload: true
      when: old_promtail_service.stat.exists

    - name: Check for Alloy {{ alloy_architecture }}/{{ alloy_version }}
      stat:
        path: ~/alloy-{{ alloy_architecture }}
      register: alloy

    # Alloy ships as a .zip, and ansible's unarchive shells out to unzip for those. Ubuntu's
    # base image has no unzip, so the task fails with "Unable to find required 'unzip' or
    # 'zipinfo' binary in the path" after a confusing wall of tar errors — MEASURED on Ubuntu
    # 24.04. The Debian AMI this role grew up on happened to include it.
    - name: Install unzip, required to extract the Alloy release
      apt:
        name: unzip
        update_cache: true
      when: not alloy.stat.exists

    - name: Download Alloy {{ alloy_architecture }}/{{ alloy_version }}
      unarchive:
        src: https://github.com/grafana/alloy/releases/download/{{ alloy_version }}/alloy-{{ alloy_architecture }}.zip
        dest: /root
        remote_src: true
      when: not alloy.stat.exists

    - name: Add Alloy config to /root/alloy_config.alloy
      template:
        src: alloy_config.alloy.j2
        dest: /root/alloy_config.alloy
        owner: root
        group: root
        mode: 0644

    - name: Add alloy systemd service file to /etc/systemd/system/alloy.service
      template:
        src: alloy_systemd.service.j2
        dest: /etc/systemd/system/alloy.service
        owner: root
        group: root
        mode: 0644

    - name: Enable alloy service
      systemd:
        name: alloy
        enabled: true

    - name: Start alloy service
      systemd:
        daemon_reload: true
        name: alloy
        state: started

  become: true
