- name: grafana_alloy
  block:
    # alloy_config.alloy.j2 hardcodes `path = "/var/log/journal"` for
    # loki.source.journal. On a host where systemd-journald keeps logs in volatile
    # storage only, that directory does not exist -- Alloy still starts and passes
    # its /-/ready check, but reads and ships zero log lines. The readiness gate
    # below only observes the PROCESS, never whether it is actually reading anything,
    # so this failure mode is otherwise silent. Assert loudly here instead of letting
    # a useless install complete. Deliberately does NOT create the directory:
    # provisioning /var/log/journal switches journald to persistent storage, changing
    # disk behaviour on every node and requiring a journald restart that discards
    # existing volatile logs -- a policy decision outside this role's scope, already
    # imposed as a manual AMI-bake precondition.
    - name: Check for persistent journal directory
      stat:
        path: /var/log/journal
      register: journal_directory

    - name: Assert persistent journal directory exists so Alloy can ship logs
      assert:
        that:
          - journal_directory.stat.exists
          - journal_directory.stat.isdir
        fail_msg: >-
          /var/log/journal does not exist on this host. Alloy's loki.source.journal
          reads persistent journald storage from /var/log/journal; hosts where
          systemd-journald keeps logs in volatile storage only (/run/log/journal)
          do not have this directory, so Alloy would start, pass its readiness
          check, and ship zero log lines. This role intentionally does not create
          the directory -- switching journald to persistent storage is a disk and
          retention policy decision outside its scope. Provision /var/log/journal
          (and restart systemd-journald) as part of the AMI bake before running
          this role.

    # The extracted binary itself always lands at the fixed, architecture-only path
    # below (systemd's ExecStart depends on that fixed name), so it cannot carry the
    # version. A separate per-version marker file is what makes this check actually
    # version-aware: stating the architecture-only binary path would report "exists"
    # for ANY previously-installed version, silently skipping the download on a
    # version bump.
    - name: Check for Alloy {{ alloy_architecture }}/{{ alloy_version }}
      stat:
        path: ~/alloy-{{ alloy_architecture }}-{{ alloy_version }}.installed
      register: alloy

    # Alloy publishes only .zip artifacts, and `unarchive` shells out to unzip for
    # those. The role must install it itself rather than rely on another role in the
    # play having done so, because it also runs standalone.
    - name: Install unzip
      apt:
        name: unzip
        update_cache: true

    - name: Download Alloy {{ alloy_architecture }}/{{ alloy_version }}
      unarchive:
        src: https://github.com/grafana/alloy/releases/download/{{ alloy_version }}/alloy-{{ alloy_architecture }}.zip
        dest: /root
        remote_src: true
      when: not alloy.stat.exists

    - name: Record installed Alloy {{ alloy_architecture }}/{{ alloy_version }} marker
      file:
        path: ~/alloy-{{ alloy_architecture }}-{{ alloy_version }}.installed
        state: touch
        owner: root
        group: root
        mode: 0644
      when: not alloy.stat.exists

    - name: Add Alloy config to /root/alloy_config.alloy
      template:
        src: alloy_config.alloy.j2
        dest: /root/alloy_config.alloy
        owner: root
        group: root
        mode: 0644
      notify: restart alloy

    - name: Add alloy systemd service file to /etc/systemd/system/alloy.service
      template:
        src: alloy_systemd.service.j2
        dest: /etc/systemd/system/alloy.service
        owner: root
        group: root
        mode: 0644
      notify: restart alloy

    - name: Enable alloy service
      systemd:
        name: alloy
        enabled: true

    - name: Start alloy service
      systemd:
        daemon_reload: true
        name: alloy
        state: started

    - name: Flush handlers so a config/unit change restarts alloy before the readiness check
      meta: flush_handlers

    - name: Wait for Alloy ready
      uri:
        url: http://127.0.0.1:12345/-/ready
        status_code: 200
        timeout: 10
      register: alloy_ready
      until: alloy_ready.status == 200
      retries: 12
      delay: 5

    - name: Check if old promtail service exists
      stat:
        path: /etc/systemd/system/promtail.service
      register: old_promtail_service

    - name: Stop old promtail service
      systemd:
        name: promtail
        state: stopped
        enabled: false
      when: old_promtail_service.stat.exists
      ignore_errors: true

    - name: Remove old promtail service file
      file:
        path: /etc/systemd/system/promtail.service
        state: absent
      when: old_promtail_service.stat.exists

    - name: Reload systemd after promtail unit removal
      systemd:
        daemon_reload: true
      when: old_promtail_service.stat.exists

    - name: Find old promtail binaries
      find:
        paths: /root
        patterns: "promtail-*"
      register: old_promtail_binaries

    - name: Remove old promtail binaries
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_promtail_binaries.files }}"

    - name: Remove old promtail config
      file:
        path: /root/promtail_config.yaml
        state: absent

    - name: Remove old promtail positions file
      file:
        path: /root/promtail_positions.yaml
        state: absent

  become: true
