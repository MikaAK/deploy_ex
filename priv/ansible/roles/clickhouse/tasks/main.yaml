- name: clickhouse
  block:
  - name: Install ClickHouse apt prerequisites
    apt:
      name:
        - apt-transport-https
        - ca-certificates
        - gnupg
      state: present
      update_cache: true

  - name: Check ClickHouse GPG key
    stat:
      path: /usr/share/keyrings/clickhouse-keyring.gpg
    register: clickhouse_gpg_key

  - name: Add ClickHouse gpg key
    shell: curl -fsSL 'https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key' | gpg --dearmor -o /usr/share/keyrings/clickhouse-keyring.gpg
    when: not clickhouse_gpg_key.stat.exists

  - name: Add ClickHouse apt repository
    copy:
      dest: /etc/apt/sources.list.d/clickhouse.list
      mode: 0644
      content: |
        deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg] https://packages.clickhouse.com/deb stable main

  # Pins the install (and every future `apt upgrade`) to the same major.minor
  # this role was written against, without needing to know the exact patch
  # version — matching the pinned major.minor of the clickhouse/clickhouse-server
  # Docker image tag used elsewhere, without silently upgrading past it.
  - name: Pin ClickHouse packages to {{ clickhouse_version }}.*
    copy:
      dest: /etc/apt/preferences.d/clickhouse.pref
      mode: 0644
      content: |
        Package: clickhouse-server clickhouse-client clickhouse-common-static
        Pin: version {{ clickhouse_version }}.*
        Pin-Priority: 1001

  - name: Update apt cache
    apt:
      update_cache: true
      cache_valid_time: 0

  # DEBIAN_FRONTEND/CLICKHOUSE_SKIP_USER_SETUP steer the package's postinst
  # away from its interactive default-user password prompt. The
  # zz-allow-default-network.xml.j2 override below is the real guarantee —
  # it always wins regardless of what the postinst decided — but skipping the
  # prompt keeps this task from ever blocking on stdin.
  - name: Install ClickHouse server and client
    apt:
      name:
        - clickhouse-server
        - clickhouse-client
      state: present
    environment:
      DEBIAN_FRONTEND: noninteractive
      CLICKHOUSE_SKIP_USER_SETUP: "1"

  - name: Ensure config.d and users.d directories exist
    file:
      path: "{{ item }}"
      state: directory
      owner: clickhouse
      group: clickhouse
      mode: 0755
    loop:
      - /etc/clickhouse-server/config.d
      - /etc/clickhouse-server/users.d

  - name: Add listen/port/data-dir/memory config to config.d
    template:
      src: listen.xml.j2
      dest: /etc/clickhouse-server/config.d/listen.xml
      owner: clickhouse
      group: clickhouse
      mode: 0644
    notify: restart clickhouse-server

  # Named zz- so it merges AFTER anything the package postinst wrote to
  # users.d/default-user.xml (config.d/users.d fragments merge alphabetically,
  # last wins) — see the file's own header comment for why both the password
  # and the network need clearing, not just one.
  - name: Allow the default user from the configured network
    template:
      src: zz-allow-default-network.xml.j2
      dest: /etc/clickhouse-server/users.d/zz-allow-default-network.xml
      owner: clickhouse
      group: clickhouse
      mode: 0644
    notify: restart clickhouse-server

  - name: Deploy S3 cold-storage tier config
    template:
      src: storage-s3-tiered.xml.j2
      dest: /etc/clickhouse-server/config.d/storage-s3-tiered.xml
      owner: clickhouse
      group: clickhouse
      mode: 0644
    when: clickhouse_s3_cold_storage_enabled
    notify: restart clickhouse-server

  - name: Remove S3 cold-storage tier config when disabled
    file:
      path: /etc/clickhouse-server/config.d/storage-s3-tiered.xml
      state: absent
    when: not clickhouse_s3_cold_storage_enabled
    notify: restart clickhouse-server

  - name: Enable clickhouse-server service
    systemd:
      name: clickhouse-server
      enabled: true

  - name: Start clickhouse-server service
    systemd:
      daemon_reload: true
      name: clickhouse-server
      state: started

  become: true
