---
- name: restart certificate renewal service
  become: true
  systemd:
    name: cert-renewal
    state: restarted

- name: reload systemd
  become: true
  systemd:
    daemon_reload: yes

- name: enable certificate renewal service
  become: true
  systemd:
    name: cert-renewal
    enabled: yes

- name: enable certificate renewal timer
  become: true
  systemd:
    name: cert-renewal.timer
    enabled: yes
    state: started

- name: enable certificate initial service
  become: true
  systemd:
    name: cert-initial
    enabled: yes

# The beam release reads its TLS cert from disk at boot, so after a fresh IP
# cert is issued the running app must be restarted to serve it. The pre/post
# hooks already cycle the app during issuance; this restart is the belt-and-
# braces guarantee the TLS listener re-reads the new cert.
- name: restart app for new cert
  become: true
  systemd:
    name: "{{ app_name }}"
    state: restarted
