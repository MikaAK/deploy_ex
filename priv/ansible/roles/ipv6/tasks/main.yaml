- name: ipv6
  block:
    - name: Create ipv6 config file
      ansible.builtin.copy:
        content: export AWS_USE_DUALSTACK_ENDPOINT=true
        dest: /etc/profile.d/aws-ipv6.sh
        owner: root
        group: root
        mode: '0644'

    # The awscli role creates ~/.aws while writing credentials, so on AWS this directory
    # happened to already exist by the time the copy below ran. That was incidental, not
    # guaranteed — MEASURED on an OCI node, this task fails with "Destination directory
    # /root/.aws does not exist" and takes the whole setup play down with it.
    - name: Create /root/.aws directory
      ansible.builtin.file:
        path: /root/.aws
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Add dualstack to boto config
      ansible.builtin.copy:
        content: |
          [profile default]
          s3_use_dualstack_endpoint = true
        dest: ~/.aws/config
        owner: root
        group: root
        mode: '0644'

  become: true
