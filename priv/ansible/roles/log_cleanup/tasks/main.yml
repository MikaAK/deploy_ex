- name: log_cleanup
  block:
    - name: Create /etc/cron.weekly directory
      file:
        path: /etc/cron.weekly
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Copy clear_drive_space file to /etc/cron.weekly/clear_drive_space
      copy:
        src: clear_drive_space
        dest: /etc/cron.weekly/clear_drive_space
        owner: root
        group: root
        mode: u+x

    - name: Copy crontab file to /etc/crontab
      copy:
        src: crontab
        dest: /etc/crontab
        owner: root
        group: root
        mode: u+x

    - name: Copy rsyslog file to /etc/logrotate.d/rsyslog
      copy:
        src: rsyslog
        dest: /etc/logrotate.d/rsyslog
        owner: root
        group: root
        mode: u=rw,g=r,o=r

    - name: Create /etc/systemd/journald.conf.d directory
      file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Copy journald limits drop-in to /etc/systemd/journald.conf.d/10-limits.conf
      copy:
        src: journald-limits.conf
        dest: /etc/systemd/journald.conf.d/10-limits.conf
        owner: root
        group: root
        mode: u=rw,g=r,o=r

    - name: Restart systemd-journald to apply the journal size cap
      systemd:
        name: systemd-journald
        state: restarted

  become: true
