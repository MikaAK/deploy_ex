# Pinned getsentry/self-hosted release tag (MEASURED via GitHub API 2026-08-27:
# https://api.github.com/repos/getsentry/self-hosted/releases/latest). Bump
# deliberately — install.sh runs a full migration on upgrade.
sentry_release_version: "26.8.0"

sentry_install_dir: /opt/sentry-self-hosted

# Secondary EBS volume (terraform device_name "/dev/sdh"). Nitro-based
# instances (t3.large) expose attached EBS volumes as NVMe block devices;
# with only the root volume + this one secondary volume attached, it should
# enumerate as /dev/nvme1n1. ASSUMED — confirm with `lsblk` on first live
# apply (Sprint 2) and override this default if it differs.
sentry_data_device: /dev/nvme1n1
sentry_data_dir: /mnt/sentry-data

sentry_web_port: 9000
