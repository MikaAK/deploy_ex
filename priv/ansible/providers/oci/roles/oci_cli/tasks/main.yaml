- name: oci_cli
  block:
    - name: Check if oci cli is installed
      stat:
        path: "{{ oci_cli_bin }}"
      register: oci_cli_exe

    - name: Check installed oci cli version
      command: "{{ oci_cli_bin }} --version"
      register: oci_cli_current_version
      when: oci_cli_exe.stat.exists
      changed_when: false
      failed_when: false

    - name: Install jq and python venv support
      apt:
        name:
          - jq
          - python3-venv
        update_cache: true

    # oci-cli goes in its own virtualenv rather than into the system interpreter. On Ubuntu
    # 24.04 a plain `pip install --break-system-packages oci-cli` MEASURABLY fails: oci-cli
    # requires urllib3>=2.6.3, pip tries to replace the distro's urllib3 2.0.7, and dpkg-owned
    # packages have no RECORD file, so the uninstall aborts with
    # "Cannot uninstall urllib3 2.0.7, RECORD file not found". A venv sidesteps the conflict
    # entirely and cannot damage system Python.
    - name: Create the oci cli virtualenv
      command: "python3 -m venv {{ oci_cli_venv }}"
      args:
        creates: "{{ oci_cli_venv }}/bin/python"

    - name: Install oci-cli {{ oci_cli_version }}
      pip:
        name: "oci-cli=={{ oci_cli_version }}"
        virtualenv: "{{ oci_cli_venv }}"
      when: >-
        (not oci_cli_exe.stat.exists) or
        (oci_cli_version not in (oci_cli_current_version.stdout | default('')))

    - name: Link {{ oci_cli_bin }} onto the venv entrypoint
      file:
        src: "{{ oci_cli_venv }}/bin/oci"
        dest: "{{ oci_cli_bin }}"
        state: link

  become: true
